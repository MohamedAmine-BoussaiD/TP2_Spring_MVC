<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
</head>
<body>

<div>
    <form method="get" th:action="@{/index}">
        <label > keyword </label>
        <input type="text" name="keyword" th:value="${keyword}">
        <button class="btn btn-outline-info">Search</button>
    </form>
</div>

<div class="p-3 m-2">
    <div class="card ">
        <div class="card-header">
            Patient List
        </div>
        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <td>ID</td>
                    <td>NOM</td>
                    <td>PRENOM</td>
                    <td>DATE</td>
                    <td>SCORE</td>
                    <td>MALADE</td>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${patientList}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.nom}"></td>
                    <td th:text="${p.prenom}"></td>
                    <td th:text="${p.dateNaissance}"></td>
                    <td th:text="${p.score}"></td>
                    <td th:text="${p.malade}" ></td>
                    <td> <a class=" btn btn-danger " th:href="@{deletePatient(id=${p.id},keyword=${keyword} , page=${currentPage})}">Delete</a></td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>
</div>
<div>
    <ul class="nav nav-pills">
        <li th:each="page,status :${pages}">
            <a th:class="${status.index == currentPage ? 'btn btn-info m-1 ': 'btn btn-outline-info m-1'}" class="btn btn-outline-info m-1"  th:href="@{/index(page=${status.index},keyword=${keyword})}" th:text="${status.index}"></a>
        </li>
    </ul>
</div>



</body>
</html>
