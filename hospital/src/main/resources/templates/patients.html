<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
</head>
<body>

<div class="p-3 m-2">
    <div class="card ">
        <div class="card-header">
            Patient List
        </div>
        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <td>ID</td>
                    <td>NOM</td>
                    <td>PRENOM</td>
                    <td>DATE</td>
                    <td>SCORE</td>
                    <td>MALADE</td>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${patientList}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.nom}"></td>
                    <td th:text="${p.prenom}"></td>
                    <td th:text="${p.dateNaissance}"></td>
                    <td th:text="${p.score}"></td>
                    <td th:text="${p.malade}" ></td>
                    <td> <a class=" btn btn-danger " th:href="@{deletePatient(id=${p.id})}">Delete</a></td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>
</div>



</body>
</html>
